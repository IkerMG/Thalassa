spring:
  datasource:
    # Overridden by @DynamicPropertySource in @Testcontainers integration tests.
    # Provided here so unit tests that don't load a context don't fail on missing env vars.
    url: jdbc:h2:mem:testdb
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-minimum-256-bits-long-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

app:
  jwt:
    access-expiration-ms: 900000
    refresh-expiration-ms: 2592000000

python:
  service:
    url: http://localhost:8001

chat:
  free-daily-limit: 5
