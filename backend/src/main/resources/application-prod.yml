spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  # En producción, /actuator/prometheus debe estar detrás de una allowlist de IPs
  # (p.ej. solo accesible desde la red interna Docker o el host de Prometheus).
  # La regla authenticated() en SecurityConfig es la primera capa de defensa.
