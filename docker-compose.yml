version: "3.9"

# =============================================================================
# Thalassa — Docker Compose
# Copia .env.example a .env y rellena los valores antes de levantar.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot (Java)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thalassa-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/thalassa
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - PYTHON_SERVICE_URL=http://scraper:8001
    depends_on:
      - db
      - scraper
    networks:
      - thalassa-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — React + Vite (TypeScript)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thalassa-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - thalassa-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Scraper — FastAPI (Python)
  # ---------------------------------------------------------------------------
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: thalassa-scraper
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$GROQ_API_KEY\" ] && [ \"$$GROQ_API_KEY\" != 'tu_api_key_aqui' ] && echo OK || (echo 'GROQ_API_KEY not set or placeholder' && exit 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - thalassa-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Base de datos — PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: thalassa-db
    expose:
      - "5432"
    environment:
      POSTGRES_DB: thalassa
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - thalassa-net
    restart: unless-stopped

# =============================================================================
# Volúmenes
# =============================================================================
volumes:
  db_data:

# =============================================================================
# Redes
# =============================================================================
networks:
  thalassa-net:
    driver: bridge
