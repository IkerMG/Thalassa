name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend (spotless · test · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build, test and verify
        run: mvn -B verify

  # ── Docker ────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for build
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=thalassa
          POSTGRES_PASSWORD=ci_password
          JWT_SECRET=ci-secret-key-256-bits-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          JWT_REFRESH_SECRET=ci-refresh-secret-256-bits-xxxxxxxxxxxxxxxxxxxxxxx
          GROQ_API_KEY=ci_placeholder
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          EOF

      - name: Build images
        run: docker compose build
